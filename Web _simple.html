<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Busqueda de digimon</h1>
    <label>Tipo:</label>
  <select id="tipo">
    <option value="name">Nombre</option>
    <option value="level">Nivel</option>
  </select>
  <input type="text" id="search" placeholder="Buscar">
        <table id="lista" border="1">
            <thead>
                <tr>
                    <th>nombre</th>
                    <th>nivel</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
</body>
  <script>
    const lista= document.querySelector("#lista tbody");
    const tipo = document.getElementById("tipo");
    const search = document.getElementById("search");
    let digimons = [];

    fetch('https://digimon-api.vercel.app/api/digimon')
      .then(res => res.json())
      .then(data=> {
         digimons = data;
         mostrar(digimons);
      });
    search.addEventListener("input", ()=>{
    const texto = search.value.trim().toLowerCase();
    if(tipo.value=="level"){
      const filtrados = digimons.filter(u => u.level.toLowerCase().includes(texto));
      mostrar(filtrados);
    }
    else{
      const filtrados = digimons.filter(u => u.name.toLowerCase().includes(texto));
      mostrar(filtrados);
    }
    })


    function mostrar(datos) {
      lista.innerHTML = "";
      datos.forEach(digimon => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${digimon.name}</td>
          <td>${digimon.level}</td>
        `;
        lista.appendChild(fila);
      });
    }


  </script>
</html>
