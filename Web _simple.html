<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      background-color: rgb(15, 128, 128);
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1{
      color: rgb(0, 0, 53);
    }
    select{
      background-color: cadetblue;
    }
    table{
      border-radius: 10px;
      width: 80%;
      align-content: center;
      color: rgb(255, 255, 255);
      background-color: blue;
      padding: 1px;
    }
    label{
      color: rgba(32, 12, 78, 0.76);
    }
    tbody{
      text-align: center;
      color: black;
      background-color: beige;
    }
  </style>
</head>
<body>
  <h1>Busqueda de digimon</h1>
    <label>Tipo:</label>
  <select id="tipo">
    <option value="name">Nombre</option>
    <option value="level">Nivel</option>
  </select>
  <input type="text" id="search" placeholder="Buscar">
        <table id="lista" border="1">
            <thead>
                <tr>
                    <th>nombre</th>
                    <th>nivel</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
</body>
  <script>
    const lista= document.querySelector("#lista tbody");
    const tipo = document.getElementById("tipo");
    const search = document.getElementById("search");
    let digimons = [];

    fetch('https://digimon-api.vercel.app/api/digimon')
      .then(res => res.json())
      .then(data=> {
         digimons = data;
         mostrar(digimons);
      });
    search.addEventListener("input", ()=>{
    const texto = search.value.trim().toLowerCase();
    if(tipo.value=="level"){
      const filtrados = digimons.filter(u => u.level.toLowerCase().includes(texto));
      mostrar(filtrados);
    }
    else{
      const filtrados = digimons.filter(u => u.name.toLowerCase().includes(texto));
      mostrar(filtrados);
    }
    })
    function mostrar(datos) {
      lista.innerHTML = "";
      datos.forEach(digimon => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${digimon.name}</td>
          <td>${digimon.level}</td>
        `;
        lista.appendChild(fila);
      });
    }


  </script>
</html>
