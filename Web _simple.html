<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Busqueda de digimon</h1>
  <input type="text" id="search" placeholder="Buscar por nombre">
        <table id="lista" border="1">
            <thead>
                <tr>
                    <th>nombre</th>
                    <th>nivel</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
</body>
  <script>
    const lista= document.querySelector("#lista tbody");
    let digimons = [];

    fetch('https://digimon-api.vercel.app/api/digimon')
      .then(res => res.json())
      .then(data=> {
         digimons = data;
         mostrar(digimons);
      });

    document.getElementById("search").addEventListener("input", e => {
      const texto = e.target.value.toLowerCase();
      const filtrados = digimons.filter(u => u.name.toLowerCase().includes(texto));
      mostrar(filtrados);
    });
    function mostrar(datos) {
      lista.innerHTML = "";
      datos.forEach(digimon => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${digimon.name}</td>
          <td>${digimon.level}</td>
        `;
        lista.appendChild(fila);
      });
    }
  </script>
</html>
