<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>Galeria de pokemons</h1>
  <input type="text" id="search" placeholder="Buscar">
  <div id="lista"></div>
  <button id="atras">Atras</button>
  <button id="siguiente">Siguiente</button>
  <script>
    const lista= document.getElementById("lista");
    const Atras= document.getElementById("atras");
    const siguiente = document.getElementById("siguiente");
    let digimons = [];
    let pagina=0;

    fetch(`https://pokeapi.co/api/v2/pokemon?limit=20&offset=${pagina * 20}`)
      .then(res=>res.json())
      .then(data=>{digimons=data.results;
        mostrar(digimons);})
      .catch(error => console.log("Error: ",error));

    document.getElementById("search").addEventListener("input", e => {
    const texto = e.target.value.toLowerCase();
    const filtrados = digimons.filter(u => u.name.toLowerCase().includes(texto));
    mostrar(filtrados);
    })

    function mostrar(listaP) {
      lista.innerHTML = "";
      for (i=0;i<listaP.length;i++) {
        let nombre=listaP[i].name;
        fetch(`https://pokeapi.co/api/v2/pokemon/${nombre}`)
          .then(res=>res.json())
          .then(datos=> {
            let div=document.createElement("div");
            div.innerHTML = `
            <h3>${datos.name}</h3>
              <img src="${datos.sprites.front_default}">`;
            lista.appendChild(div);
          });
      }
    }
     siguiente.addEventListener("click",()=>{
      pagina++;
      fetch(`https://pokeapi.co/api/v2/pokemon?limit=20&offset=${pagina * 20}`)
      .then(res=>res.json())
      .then(data=>{digimons=data.results;
        mostrar(digimons);})
      .catch(error => console.log("Error: ",error));
    });

    Atras.addEventListener("click",()=>{
      if (pagina>0){
      pagina--;
      fetch(`https://pokeapi.co/api/v2/pokemon?limit=20&offset=${pagina * 20}`)
      .then(res=>res.json())
      .then(data=>{digimons=data.results;
        mostrar(digimons);})
      .catch(error => console.log("Error: ",error));
      }
    });

  </script>
</body>
</html>
